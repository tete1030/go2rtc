name: WebRTC unit tests

on:
  push:
    paths:
      - "pkg/webrtc/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/webrtc-tests.yml"
  pull_request:
    paths:
      - "pkg/webrtc/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/webrtc-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - run: go test -race ./pkg/webrtc
